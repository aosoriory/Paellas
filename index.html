<script>const {

// Pega la URL del proyecto y la clave "anon public" (Supabase > Project Settings > API).
const SUPABASE_URL = "https://awhuyuhjqmpteqnxwlgw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3aHV5dWhqcW1wdGVxbnh3bGd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDQ0NjMsImV4cCI6MjEwMjcyMDQ2M30.0X2bxSxFn93am5EXHbxLrE0GZg_ujtAcLoKkjn5pPS8";

const storage = {
  async get(key) {
    const url = `${SUPABASE_URL}/rest/v1/app_storage?key=eq.${encodeURIComponent(key)}&select=value`;
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`
