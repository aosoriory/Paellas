  async get(key) {
    const { data, error } = await sb.from("app_storage").select("value").eq("key", key).maybeSingle();
    if (error) throw error;
    return data ? data.value : null;
  },
  async set(key, value) {
    const { error } = await sb.from("app_storage").upsert({ key, value, updated_at: new Date().toISOString() });
    if (error) throw error;
    return true;
  },
};

function Icon({ children, size = 16 }) {
  return <span style={{ fontSize: size, lineHeight: 1, display: "inline-block" }}>{children}</span>;
}

function ImgThumb({ url, size = 44 }) {
  const [broken, setBroken] = useState(false);
  if (!url || broken) {
    return <div style={{ width: size, height: size, borderRadius: 8, background: THEME.borderSoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><Icon size={14}>🖼️</Icon></div>;
  }
  return <img src={url} onError={() => setBroken(true)} alt="" style={{ width: size, height: size, borderRadius: 8, objectFit: "cover", flexShrink: 0, border: `1px solid ${THEME.border}` }} />;
}

function NoteBadge({ note }) {
  if (!note) return null;
  const lower = note.toLowerCase();
  let bg = THEME.borderSoft, color = THEME.inkSoft;
  if (lower.includes("sobr")) { bg = "#EAEEDA"; color = THEME.oliveDark; }
  else if (lower.includes("falt")) { bg = "#FBEAE4"; color = THEME.tomatoDark; }
  return <span style={{ background: bg, color, fontSize: 11, fontWeight: 600, borderRadius: 20, padding: "2px 8px", whiteSpace: "nowrap" }}>{note}</span>;
}

function App() {
  const [data, setData] = useState(null);
  const [shoppingList, setShoppingList] = useState(null);
  const [history, setHistory] = useState(null);
  const [tab, setTab] = useState("shopping");
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [confirmRegen, setConfirmRegen] = useState(false);
  const [savingNote, setSavingNote] = useState("");

  useEffect(() => {
    let cancelled = false;
    async function load() {
      try {
        let d = await storage.get("paella-club-data");
        if (!d) { d = { ingredients: SEED_INGREDIENTS, supermarkets: SEED_SUPERMARKETS }; await storage.set("paella-club-data", d); }
        let sl = await storage.get("paella-shopping-list");
        let h = await storage.get("paella-history");
        if (!h) { h = SEED_HISTORY; await storage.set("paella-history", h); }
        if (!cancelled) { setData(d); setShoppingList(sl); setHistory(h); setLoading(false); }
      } catch (e) {
        console.error(e);
        if (!cancelled) { setError("No se ha podido conectar con Supabase. Revisa la URL y la clave."); setLoading(false); }
      }
    }
    load();
    return () => { cancelled = true; };
  }, []);

  const persistData = useCallback(async (next) => {
    setData(next);
    try { setSavingNote("Guardando…"); await storage.set("paella-club-data", next); setSavingNote("Guardado"); setTimeout(() => setSavingNote(""), 900); }
    catch { setError("No se ha podido guardar el cambio."); setTimeout(() => setError(""), 2500); }
  }, []);

  const persistShoppingList = useCallback(async (next) => {
    setShoppingList(next);
    try { await storage.set("paella-shopping-list", next); }
    catch { setError("No se ha podido guardar la lista de la compra."); setTimeout(() => setError(""), 2500); }
  }, []);

  const persistHistory = useCallback(async (next) => {
    setHistory(next);
    try { setSavingNote("Guardando…"); await storage.set("paella-history", next); setSavingNote("Guardado");
