const storage = {
  async get(key) {
    const url = `${SUPABASE_URL}/rest/v1/app_storage?key=eq.${encodeURIComponent(key)}&select=value`;
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    if (!res.ok) throw new Error(`Supabase GET ${res.status}: ${await res.text()}`);
    const rows = await res.json();
    return rows.length ? rows[0].value : null;
  },
  async set(key, value) {
    const url = `${SUPABASE_URL}/rest/v1/app_storage`;
    const res = await fetch(url, {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify({
        key,
        value,
        updated_at: new Date().toISOString()
      })
    });
    if (!res.ok) throw new Error(`Supabase POST ${res.status}: ${await res.text()}`);
    return true;
  }
};

function moveWithinGroup(list, id, groupKeyFn, direction) {
  const target = list.find(x => x.id === id);
  if (!target) return list;
  const groupKey = groupKeyFn(target);
  const indices = [];
  list.forEach((x, i) => {
    if (groupKeyFn(x) === groupKey) indices.push(i);
  });
  const pos = indices.indexOf(list.findIndex(x => x.id === id));
  const swapPos = pos + direction;
  if (swapPos < 0 || swapPos >= indices.length) return list;
  const i1 = indices[pos],
    i2 = indices[swapPos];
  const next = list.slice();
  const tmp = next[i1];
  next[i1] = next[i2];
  next[i2] = tmp;
  return next;
}
